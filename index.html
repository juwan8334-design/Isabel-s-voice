<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142d50">
  <meta name="description" content="학생의 목소리가 학교의 변화가 됩니다.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Isabel's Voice</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-page="home" aria-label="Isabel's Voice 홈">
      <span class="brand-mark">IV</span>
      <span><strong>Isabel's Voice</strong><small>학생의 목소리가 학교의 변화가 됩니다.</small></span>
    </a>
    <button class="admin-link" data-page="admin">관리자</button>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">STUDENT COMMUNITY</span>
        <h1>우리의 의견이<br>학교를 바꿉니다.</h1>
        <p>학교에 바라는 점을 자유롭게 이야기해 주세요.</p>
      </div>
      <div class="hero-mark" aria-hidden="true">IV</div>
    </section>

    <nav class="menu-grid" aria-label="주요 메뉴">
      <button class="menu-card active" data-page="board"><span class="menu-icon">▤</span><b>건의 보기</b><small>학생들의 의견 확인</small></button>
      <button class="menu-card" data-page="write"><span class="menu-icon">＋</span><b>건의하기</b><small>새로운 의견 등록</small></button>
      <button class="menu-card" data-page="vote"><span class="menu-icon">✓</span><b>투표하기</b><small>학교의 선택에 참여</small></button>
      <button class="menu-card" data-page="events"><span class="menu-icon">◇</span><b>특별 이벤트</b><small>진행 중인 행사</small></button>
    </nav>

    <section id="notice" class="notice">
      <strong>시제품 안내</strong>
      <span>현재는 화면과 기능을 시험하는 데모입니다. 입력한 내용은 이 기기에만 저장되며 다른 학생과 공유되지 않습니다. 실제 학번·이름은 입력하지 마세요.</span>
    </section>

    <section id="view" aria-live="polite"></section>
  </main>

  <footer class="footer">ISABEL'S VOICE <span>학생자치 소통 플랫폼 시제품</span></footer>
  <script src="./app.js"></script>
</body>
</html>
